# REVIEW BEFORE INSTALL — production cutover template
# Do not enable this file until:
#   1. The existing LiteSpeed/Apache/Nginx vhost is backed up.
#   2. WordPress remains reachable for /wp-json/, /wp-admin/, and /wp-content/.
#   3. Staging on 127.0.0.1:3001 is healthy.
#   4. Cutover is explicitly approved.
#
# LIVE SITE NOTE
# Production currently advertises LiteSpeed. Confirm the actual daemon before
# installing Nginx on ports 80/443. If LiteSpeed owns those ports, use the
# LiteSpeed reverse-proxy steps in deploy/HOSTINGER.md instead of this file.
#
# WordPress PHP backend
# Replace WORDPRESS_BACKEND with the inspected upstream, for example:
#   http://127.0.0.1:8080   (Apache/LiteSpeed on an internal port)
#   unix:/run/php/php8.3-fpm.sock  (requires fastcgi, not proxy_pass)
# Do not guess this value.

upstream pms_next {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Set this after inspecting the current WordPress listener.
# upstream pms_wordpress {
#     server 127.0.0.1:8080;
# }

server {
    listen 80;
    listen [::]:80;
    server_name peacemarineservices.com.au www.peacemarineservices.com.au;
    return 301 https://peacemarineservices.com.au$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.peacemarineservices.com.au;

    # Preserve existing certificate paths after inspection. Examples:
    # ssl_certificate     /etc/letsencrypt/live/peacemarineservices.com.au/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/peacemarineservices.com.au/privkey.pem;

    return 301 https://peacemarineservices.com.au$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name peacemarineservices.com.au;

    # ssl_certificate     /etc/letsencrypt/live/peacemarineservices.com.au/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/peacemarineservices.com.au/privkey.pem;

    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Keep WordPress REST, admin, and uploads on the existing CMS.
    location ^~ /wp-json/ {
        proxy_pass http://WORDPRESS_BACKEND;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /wp-admin/ {
        proxy_pass http://WORDPRESS_BACKEND;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /wp-content/ {
        proxy_pass http://WORDPRESS_BACKEND;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /wp-includes/ {
        proxy_pass http://WORDPRESS_BACKEND;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(wp-login\.php|xmlrpc\.php)$ {
        proxy_pass http://WORDPRESS_BACKEND;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://pms_next;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://pms_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
